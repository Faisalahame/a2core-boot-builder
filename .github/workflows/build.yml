name: Build v7 (SELINUX=y+BOOTPARAM + forced cmdline)
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Deps + toolchain + magiskboot
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make wget unzip cpio gcc-aarch64-linux-gnu
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 ~/tc49
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v26.4/Magisk-v26.4.apk
          unzip -j Magisk-v26.4.apk 'lib/x86_64/libmagiskboot.so' -d .
          mv libmagiskboot.so magiskboot && chmod +x magiskboot
      - name: Get kernel source + Lineage ramdisk donor
        run: |
          gh release download kernel-src -R Faisalahame/android_kernel_samsung_a2corelte -p Kernel.tar.gz
          gh release download run-35587451585 -R Faisalahame/lineage-a2corelte -p boot.img --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch + build kernel (v7)
        run: |
          set -x
          export ANDROID_MAJOR_VERSION=o
          mkdir ksrc && tar -xzf Kernel.tar.gz -C ksrc && chmod -R u+w ksrc
          cd ksrc
          mkdir -p firmware && touch firmware/gnss_firmware.bin
          echo "HOSTCFLAGS += -fcommon" >> Makefile
          sed -i 's/\$(shell expr [^)]*)/9/g' drivers/net/wireless/Makefile
          KC="ARCH=arm64 CROSS_COMPILE=$HOME/tc49/bin/aarch64-linux-android-"
          make $KC exynos7870-a2corelte_defconfig < /dev/null
          scripts/config --file .config \
            --set-val CONFIG_PSTORE y --set-val CONFIG_RAMOOPS y \
            --set-val CONFIG_PSTORE_CONSOLE y --set-val CONFIG_PSTORE_RAM y \
            --set-val CONFIG_FRAMEBUFFER_CONSOLE y \
            --set-val CONFIG_SECURITY_SELINUX y \
            --set-val CONFIG_SECURITY_SELINUX_BOOTPARAM y \
            --set-val CONFIG_CMDLINE_FORCE y \
            --set-str CONFIG_CMDLINE "console=ram loglevel=8 initcall_debug initcall_blacklist=alsa_sound_last_init sec_debug.level=0 sec_watchdog.sec_pet=5 androidboot.debug_level=0x4f4c androidboot.dram_info=01,05,00,1G androidboot.ap_serial=0x07167503865C sec_debug.pcb_offset=7343872 sec_debug.smd_offset=7344896 sec_debug.lpddr4_size=1 sec_debug.sjl=1 ess_setup=0x46000000 tima_log=0x200000@0x52a00000 sec_avc_log=0x40000@0x4680a000 sec_tsp_log=0x40000@0x4684c000 sec_debug.base=0x100000@0x4688e000 auto_summary_log=0x10000@0x46990000 s3cfb.bootloaderfb=0x67000000 lcdtype=549412 consoleblank=0 vmalloc=384m ehci_hcd.park=3 androidboot.bootmode=normal pmic_info=83 fg_reset=0 androidboot.emmc_checksum=3 sales_code=BKD androidboot.bootloader=A260GDDSCAUJ1 androidboot.selinux=disabled androidboot.ucs_mode=0 androidboot.revision=1 androidboot.hardware=samsungexynos7870 androidboot.warranty_bit=1 androidboot.sec_atd.tty=/dev/ttySAC2 androidboot.serialno=5200194c4ccc96f5 snd_soc_core.pmdown_time=1000 androidboot.em.did=07167503865c androidboot.em.model=SM-A260G androidboot.em.status=0x0 androidboot.verifiedbootstate=orange reserve-fimc=0 firmware_class.path=/vendor/firmware factory_mode=0" \
            --set-val CONFIG_CONSOLE_LOGLEVEL_DEFAULT 8 \
            --set-val CONFIG_MESSAGE_LOGLEVEL_DEFAULT 7
          scripts/config --file .config \
            --disable CONFIG_VIDEO_SAMSUNG_EXYNOS_FIMC_IS \
            --disable CONFIG_VIDEO_EXYNOS_FIMC \
            --disable CONFIG_VIDEO_SAMSUNG_EXYNOS5_FIMC_IS \
            --disable CONFIG_VIDEO_SAMSUNG_EXYNOS_FIMC_CAPTURE
          make $KC olddefconfig < /dev/null
          grep -E "CMDLINE_FORCE|SECURITY_SELINUX|LOGLEVEL_DEFAULT|PSTORE_CONSOLE|RAMOOPS" .config
          set +e
          make $KC -j2 Image dtbs < /dev/null 2>&1 | tee ../kernel_build.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "KERNEL MAKE FAILED rc=$RC"
            tail -80 ../kernel_build.log
            exit 1
          fi
          DTB=$(find arch/arm64/boot/dts -name '*a2core*.dtb' | head -1)
          cat arch/arm64/boot/Image $DTB > ../kernel-dtb
          cd ..
      - name: Pack v13 boot.img (standard cpio - modes preserved)
        run: |
          set -x
          ./magiskboot unpack boot.img
          curl -sfL -o fstab.samsungexynos7870 https://raw.githubusercontent.com/Faisalahame/lineage-a2corelte/main/rootdir/fstab.samsungexynos7870
          sed -i 's/,verify//g; s/,avb=vbmeta//g; s/,avb_keys=.*//g' fstab.samsungexynos7870
          mkdir rd && cd rd
          cpio -idm < ../ramdisk.cpio
          # Strip restorecon /vendor from init.rc to bypass missing vendor file_contexts
          # Ensure init doesn't crash if it encounters missing directories
          sed -i 's/^mkdir.*\/mnt\/vendor/#&/' init.rc || true
          ls -la init
          chmod 755 init
          cp ../fstab.samsungexynos7870 . && chmod 644 fstab.samsungexynos7870
          find . | cpio -o -H newc --owner=root:root > ../ramdisk.cpio || find . | cpio -o -H newc > ../ramdisk.cpio
          cd ..
          cpio -itv < ramdisk.cpio | head -12
          cp kernel-dtb kernel
          ./magiskboot repack boot.img patched_boot.img
          ls -la patched_boot.img
      - name: Build static secilc wrapper (no shebang, no interpreter)
        run: |
          cat > secilc_wrap.c <<'CEOF'
          #include <stdio.h>
          #include <string.h>
          #include <fcntl.h>
          #include <unistd.h>
          int main(int argc,char**argv){
            int fd=open("/dev/kmsg",O_WRONLY);
            if(fd>=0){char b[512];int n=snprintf(b,sizeof b,"SECILC-WRAPPER:");
              for(int i=1;i<argc&&n<(int)sizeof(b)-1;i++)n+=snprintf(b+n,sizeof(b)-n," %s",argv[i]);
              if(n<(int)sizeof(b)-1){b[n++]='\n';write(fd,b,n);}close(fd);}
            const char*out=0;
            for(int i=1;i+1<argc;i++)if(!strcmp(argv[i],"-o"))out=argv[i+1];
            if(!out)return 0;
            int s=open("/vendor/etc/selinux/twrp_policy",O_RDONLY);
            if(s<0)return 1;
            int d=open(out,O_WRONLY|O_CREAT|O_TRUNC,0644);
            if(d<0){close(s);return 2;}
            char buf[65536];ssize_t r;
            while((r=read(s,buf,sizeof buf))>0){ssize_t w=0;
              while(w<r){ssize_t k=write(d,buf+w,r-w);if(k<=0)return 3;w+=k;}}
            close(s);close(d);return 0;
          }
          CEOF
          sed -i 's/^          #include/#include/; s/^          int main/int main/; s/^            /    /; s/^          }/}/' secilc_wrap.c
          aarch64-linux-gnu-gcc -static -O2 -o secilc_wrap secilc_wrap.c
          ls -la secilc_wrap
      - name: Build static secilc wrapper (no shebang, no interpreter)
        run: |
          cat > secilc_wrap.c <<'CEOF'
          #include <stdio.h>
          #include <string.h>
          #include <fcntl.h>
          #include <unistd.h>
          int main(int argc,char**argv){
            int fd=open("/dev/kmsg",O_WRONLY);
            if(fd>=0){char b[512];int n=snprintf(b,sizeof b,"SECILC-WRAPPER:");
              for(int i=1;i<argc&&n<(int)sizeof(b)-1;i++)n+=snprintf(b+n,sizeof(b)-n," %s",argv[i]);
              if(n<(int)sizeof(b)-1){b[n++]='\n';write(fd,b,n);}close(fd);}
            const char*out=0;
            for(int i=1;i+1<argc;i++)if(!strcmp(argv[i],"-o"))out=argv[i+1];
            if(!out)return 0;
            int s=open("/vendor/etc/selinux/twrp_policy",O_RDONLY);
            if(s<0)return 1;
            int d=open(out,O_WRONLY|O_CREAT|O_TRUNC,0644);
            if(d<0){close(s);return 2;}
            char buf[65536];ssize_t r;
            while((r=read(s,buf,sizeof buf))>0){ssize_t w=0;
              while(w<r){ssize_t k=write(d,buf+w,r-w);if(k<=0)return 3;w+=k;}}
            close(s);close(d);return 0;
          }
          CEOF
          sed -i 's/^          #include/#include/; s/^          int main/int main/; s/^            /    /; s/^          }/}/' secilc_wrap.c
          aarch64-linux-gnu-gcc -static -O2 -o secilc_wrap secilc_wrap.c
          ls -la secilc_wrap
      - name: Upload v7
        uses: softprops/action-gh-release@v2
        with:
          tag_name: patched-boot-v7
          files: |
            patched_boot.img
            secilc_wrap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload kernel build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: kernel_build.log
