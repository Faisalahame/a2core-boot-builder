name: Build v5 (Self-Compiled Q-Ready Kernel + Lineage Ramdisk)
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Deps + toolchain + magiskboot
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make wget unzip cpio
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 ~/tc49
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v26.4/Magisk-v26.4.apk
          unzip -j Magisk-v26.4.apk 'lib/x86_64/libmagiskboot.so' -d .
          mv libmagiskboot.so magiskboot && chmod +x magiskboot
      - name: Get kernel source + Lineage ramdisk donor
        run: |
          gh release download kernel-src -R Faisalahame/android_kernel_samsung_a2corelte -p Kernel.tar.gz
          gh release download run-35587451585 -R Faisalahame/lineage-a2corelte -p boot.img --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch + build kernel (prompt-proof)
        run: |
          set -x
          export ANDROID_MAJOR_VERSION=o
          mkdir ksrc && tar -xzf Kernel.tar.gz -C ksrc
          cd ksrc
          mkdir -p firmware && touch firmware/gnss_firmware.bin
          sed -i 's/\$(shell expr [^)]*)/9/g' drivers/net/wireless/Makefile
          KC="ARCH=arm64 CROSS_COMPILE=$HOME/tc49/bin/aarch64-linux-android-"
          make $KC exynos7870-a2corelte_defconfig < /dev/null
          scripts/config --file .config \
            --set-val CONFIG_PSTORE y --set-val CONFIG_RAMOOPS y \
            --set-val CONFIG_PSTORE_CONSOLE y --set-val CONFIG_PSTORE_RAM y \
            --set-val CONFIG_FRAMEBUFFER_CONSOLE y \
            --set-val CONFIG_CMDLINE_FORCE y \
            --set-str CONFIG_CMDLINE "console=ram loglevel=8 androidboot.hardware=samsungexynos7870 androidboot.selinux=permissive selinux=0 firmware_class.path=/vendor/firmware"
          make $KC olddefconfig < /dev/null
          make $KC -j$(nproc) Image dtbs < /dev/null
          DTB=$(find arch/arm64/boot/dts -name '*a2core*.dtb' | head -1)
          cat arch/arm64/boot/Image $DTB > ../kernel-dtb
          cd ..
      - name: Pack v5 boot.img (fail loudly if any patch misses)
        run: |
          set -x
          ./magiskboot unpack boot.img
          mkdir rd && cd rd
          ../magiskboot cpio ../ramdisk.cpio extract || true
          [ -f init.rc ] || cpio -idm < ../ramdisk.cpio
          ls init.rc fstab.samsungexynos7870
          sed -i 's/,verify//g; s/,avb=vbmeta//g; s/,avb_keys=.*//g' fstab.samsungexynos7870
          sed -i 's/,verify//g; s/,avb=vbmeta//g; s/,avb_keys=.*//g' fstab.exynos7870 || true
          grep -q "setenforce 0" init.rc || sed -i '/on early-init/a\    setenforce 0' init.rc
          grep -q "write /dev/watchdog V" init.rc || printf 'on early-init\n    write /dev/watchdog V\n' >> init.rc
          cd ..
          rm -f ramdisk.cpio
          (cd rd && find . | cpio -o -H newc > ../ramdisk.cpio)
          cp kernel-dtb kernel
          ./magiskboot repack boot.img patched_boot.img
          ls -la patched_boot.img
      - name: Upload v5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: patched-boot-v5
          files: patched_boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
